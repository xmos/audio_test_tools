[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio_test_tools"
description = "tools for audio testing"
version = "4.5.2"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
test = [
    "pytest==6.2.5",
    "pytest-xdist==1.34",
    "flake8",
    "pylint",
]
